name: Build agent (Windows .exe + Linux + AppImage)

on:
  push:
    branches: [ '**' ]   # mọi nhánh -> luôn có bản build để thử
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Build Windows .exe
        run: |
          cd agent
          python -m PyInstaller --noconfirm clickdongbo-agent.spec
          Copy-Item config.json dist\config.json -Force

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path agent\dist\* -DestinationPath clickdongbo-agent-windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clickdongbo-agent-exe
          path: clickdongbo-agent-windows.zip

  build-linux:
    # 22.04 (glibc 2.35) để binary chạy được trên các distro cũ hơn runner mới nhất
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Build Linux binary
        run: |
          cd agent
          python -m PyInstaller --noconfirm clickdongbo-agent.spec
          cp -f config.json setup-linux.sh dist/
          chmod +x dist/clickdongbo-agent dist/setup-linux.sh

      - name: Create tar.gz archive
        run: tar -czf clickdongbo-agent-linux.tar.gz -C agent/dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clickdongbo-agent-linux
          path: clickdongbo-agent-linux.tar.gz

      - name: Build AppImage
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends file
          ./agent/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: clickdongbo-agent-appimage
          path: agent/dist/ClickDongBo-x86_64.AppImage
