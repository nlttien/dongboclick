# (Tuỳ chọn) Reverse proxy nginx + HTTPS cho Click Đồng Bộ
# Đặt vào /etc/nginx/sites-available/ rồi symlink sang sites-enabled
#
# Cài cert:  sudo apt install nginx && sudo certbot --nginx -d tendomain.com
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name tendomain.com;          # <<< đổi thành domain/IP của bạn

    # Phục vụ trang web client + WebSocket qua cùng cổng
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Cần thiết cho WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;       # giữ kết nối WS lâu dài
    }
}
